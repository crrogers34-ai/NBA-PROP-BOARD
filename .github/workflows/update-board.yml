name: Update board

on:
  # Cloudflare starts this workflow on time at 8 AM, 12 PM, 3 PM and 6 PM Eastern (see wrangler.jsonc).
  # GitHub's schedule below is a backup about 40 minutes later; it skips itself if a fresh update already ran.
  schedule:
    - cron: "40 13 * * *"
    - cron: "40 17 * * *"
    - cron: "40 20 * * *"
    - cron: "40 23 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # A late GitHub backup run stands down if an update already ran in the last 2.5 hours.
      - name: Check for a recent update
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as d
          try:
              g = d.datetime.fromisoformat(json.load(open("board.json"))["generated"])
              age = (d.datetime.now(d.timezone.utc) - g).total_seconds() / 60
          except Exception:
              age = 1e9
          print("skip=true" if age < 150 else "skip=false")
          PY
      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.fresh.outputs.skip != 'true'
      # Box scores already downloaded are kept between runs, so each run only fetches new games.
      - uses: actions/cache@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          path: .nba_cache
          key: nba-cache-${{ github.run_id }}
          restore-keys: nba-cache-
      - run: python build_nba.py
        if: steps.fresh.outputs.skip != 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NBA_SOURCE: espn   # NBA.com blocks GitHub's servers, so the scheduled run reads ESPN box scores
      - name: Log first basket chances
        if: steps.fresh.outputs.skip != 'true'
        run: node fb_predict.js
      - name: Commit data files
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add *.json
          git diff --staged --quiet || (git commit -m "Update board" && git pull --rebase && git push)
